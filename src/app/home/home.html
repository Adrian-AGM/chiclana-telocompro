<tui-tiles
    class="tiles"
    [debounce]="500"
    [(order)]="order"
>
    @for (item of items; track item) {
        <tui-tile
            class="tile"
            [style.order]="order.get($index)"
        >
            <div
                class="content"
            >
                <h2 class="title">{{ item.owner }}</h2>
                <tui-textfield>
                    <input
                        placeholder="Producto"
                        [tuiFluidTypography]="[0.5,2.5]"
                        [(ngModel)]="item.product"
                        tuiInput
                    />
                </tui-textfield>
                <div 
                    class="paste-container" 
                    (paste)="onPaste($event, $index)">
                    
                    <p *ngIf="!item.image">
                        Haz clic aquí dentro y presiona <strong>Ctrl + V</strong> (o Cmd + V) para pegar una imagen.
                    </p>
                    @if (item.image) {
                        <div class="preview-container">
                            <img [src]="item.image" style="max-width: 100%; height: 300px;" alt="Vista previa de la imagen pegada" />
                        </div>
                    }
                </div>

                <tui-icon
                    icon="@tui.grip-vertical"
                    tuiTileHandle
                    class="handle"
                />
                <tui-icon
                    icon="@tui.grip-vertical"
                    tuiTileHandle
                    class="handle"
                />
            </div>
        </tui-tile>
    }
</tui-tiles>
