name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ] # O el nombre de tu rama principal (master/main)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: ./node_modules/.bin/ng build --base-href /chiclana-telocompro/
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/chiclana-telocompro/browser # Ajusta a dist/telocompro si usas Angular antiguo
          branch: gh-pages